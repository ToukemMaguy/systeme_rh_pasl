<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Système RH{% endblock %} — Panafrican SL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <style>
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-weight: normal;
    font-style: normal;
    font-size: 24px;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    display: inline-block;
    white-space: nowrap;
    word-wrap: normal;
    direction: ltr;
    -webkit-font-smoothing: antialiased;
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  ::-webkit-scrollbar { display: none; }
</style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "outline-variant": "#c0c7cf", "surface-dim": "#d3daea", "on-tertiary": "#ffffff",
            "surface-container-low": "#f0f3ff", "on-primary-fixed": "#001e2f", "surface": "#f9f9ff",
            "surface-variant": "#dce2f3", "error-container": "#ffdad6", "primary-fixed-dim": "#93cdf9",
            "tertiary-fixed-dim": "#9fcaff", "background": "#f9f9ff", "on-tertiary-container": "#95c4ff",
            "on-surface": "#151c27", "on-primary": "#ffffff", "inverse-on-surface": "#ebf1ff",
            "surface-container-highest": "#dce2f3", "inverse-primary": "#93cdf9", "surface-container-lowest": "#ffffff",
            "primary-fixed": "#c9e6ff", "on-secondary-container": "#15637f", "surface-bright": "#f9f9ff",
            "on-primary-fixed-variant": "#004b6f", "secondary-container": "#9cddfe", "secondary-fixed": "#bfe8ff",
            "error": "#ba1a1a", "tertiary-container": "#00518c", "on-tertiary-fixed": "#001d37",
            "tertiary": "#003a66", "outline": "#71787f", "secondary": "#1a6682",
            "surface-container": "#e7eefe", "on-tertiary-fixed-variant": "#00497e", "on-secondary": "#ffffff",
            "on-primary-container": "#8ec7f3", "on-background": "#151c27", "primary": "#003c59",
            "on-secondary-fixed-variant": "#004d65", "on-error-container": "#93000a", "primary-container": "#06547a",
            "surface-tint": "#23648a", "on-error": "#ffffff", "inverse-surface": "#2a313d",
            "tertiary-fixed": "#d2e4ff", "on-secondary-fixed": "#001f2a", "on-surface-variant": "#41484e",
            "secondary-fixed-dim": "#8ecfef", "surface-container-high": "#e2e8f8"
          },
          borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
          spacing: { "space-sm": "0.5rem", margin: "1.5rem", "space-lg": "1.5rem", "space-xl": "2rem", gutter: "1.5rem", "space-xs": "0.25rem", "space-md": "1rem" },
          fontFamily: { sans: ["Inter", "sans-serif"] }
        }
      }
    };
  </script>
</head>
<body class="bg-background font-sans text-[14px] text-on-surface antialiased">
  {% include "_sidebar.html" %}
  <div class="pl-[240px]">
    <header class="fixed top-0 left-[240px] right-0 h-[58px] bg-surface-container-lowest shadow-[0_1px_8px_rgba(0,0,0,0.04)] z-30 flex items-center justify-between px-6">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-[18px] text-outline">corporate_fare</span>
        <span class="text-[11px] text-on-surface-variant font-medium">Panafrican SL</span>
        <span class="text-[11px] text-outline">/</span>
        <span class="text-[11px] text-primary font-semibold">{% block breadcrumb %}Portail RH{% endblock %}</span>
      </div>
    </header>
    <main class="relative pt-[58px] w-full min-h-screen bg-surface px-6 py-6">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script>
  // Gestion globale des filtres masquables
  function toggleFiltres(idZone) {
    var zone = document.getElementById(idZone);
    if (!zone) return;

    var contenu = zone.querySelector('.filtres-contenu');
    var bouton = zone.querySelector('.btn-toggle-filtres');
    if (!contenu) return;

    if (contenu.style.display === 'none') {
      contenu.style.display = 'block';
      if (bouton) bouton.classList.add('actif');
    } else {
      contenu.style.display = 'none';
      if (bouton) bouton.classList.remove('actif');
    }
  }

  // Auto-init : compter les filtres actifs au chargement
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.zone-filtres').forEach(function(zone) {
      var formulaire = zone.querySelector('form');
      if (!formulaire) return;

      var actifs = 0;
      formulaire.querySelectorAll('input, select').forEach(function(champ) {
        if (champ.type === 'checkbox' || champ.type === 'radio') {
          if (champ.checked) actifs++;
        } else if (champ.value && champ.value !== '') {
          actifs++;
        }
      });

      var badge = zone.querySelector('.badge-filtres-actifs');
      if (badge && actifs > 0) {
        badge.textContent = actifs;
        badge.style.display = 'inline-flex';
      }
    });
  });
</script>
</body>
</html>
